<head>

  <style>
    /* Base styles */
    html,body,#root{height:100%;margin:0;padding:0;background:#0B0B12;}
    
    /* Main App Styles */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    ::-webkit-scrollbar{display:none;}
    body{background:#0B0B12;}
    .app{font-family:'DM Sans',sans-serif;background:#0B0B12;min-height:100dvh;color:#f0f0f8;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
    .screen{flex:1;display:flex;flex-direction:column;}
    .scroll{flex:1;overflow-y:auto;padding:0 20px 100px;}
    .hdr{padding:52px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;}
    .hdr-sub{font-size:12px;color:#555;font-weight:600;letter-spacing:.8px;text-transform:uppercase;}
    .hdr-title{font-size:22px;font-weight:700;color:#f0f0f8;margin-top:2px;}
    .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
    .badge{display:flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;}
    .badge-on{background:#0d1a0d;border:1px solid #2a4a2a;color:#4ade80;}
    .badge-off{background:#1a1010;border:1px solid #4a2a2a;color:#f87171;}
    .badge-partner{background:#1a0d2a;border:1px solid #4a2a5a;color:#c084fc;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
    .dot{width:7px;height:7px;border-radius:50%;}
    .dot-on{background:#4ade80;animation:pulse 2s infinite;}
    .dot-off{background:#f87171;}
    .dot-pur{background:#c084fc;animation:pulse 2s infinite;}
    .balance-card{margin:0 20px 20px;background:linear-gradient(135deg,#1a1040,#0e1a3a);border-radius:24px;padding:24px;border:1px solid #2a2060;position:relative;overflow:hidden;}
    .balance-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(124,92,252,.25),transparent 70%);}
    .balance-card::after{content:'';position:absolute;bottom:-30px;left:-20px;width:110px;height:110px;background:radial-gradient(circle,rgba(58,142,255,.2),transparent 70%);}
    .bal-label{font-size:11px;color:#8888aa;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
    .bal-amount{font-size:34px;font-weight:700;color:#fff;margin:6px 0 20px;font-family:'DM Mono',monospace;letter-spacing:-1px;}
    .bal-row{display:flex;gap:10px;}
    .mini-stat{flex:1;background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px;}
    .mini-label{font-size:10px;color:#8888aa;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px;}
    .mini-dot{width:6px;height:6px;border-radius:50%;}
    .mini-val{font-size:14px;font-weight:700;margin-top:4px;font-family:'DM Mono',monospace;}
    .sec-title{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
    .cat-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .cat-bar-bg{flex:1;background:#1e1e2e;border-radius:999px;height:5px;}
    .cat-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7c5cfc,#3a8eff);}
    .tx-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #13131c;}
    .tx-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .tx-info{flex:1;min-width:0;}
    .tx-desc{font-size:14px;font-weight:600;color:#f0f0f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tx-meta{font-size:11px;color:#555;margin-top:2px;}
    .who-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:3px;}
    .tx-amount{font-size:14px;font-weight:700;font-family:'DM Mono',monospace;flex-shrink:0;}
    .del-btn{background:none;border:none;cursor:pointer;font-size:14px;opacity:.35;padding:4px;line-height:1;}
    .form-card{background:#13131c;border-radius:24px;border:1px solid #1e1e2e;padding:20px;}
    .toggle-row{display:flex;background:#0d0d14;border-radius:14px;padding:4px;margin-bottom:20px;border:1px solid #1e1e2e;}
    .tog-btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;background:none;color:#444;}
    .tog-in{background:#0d1f0d!important;color:#4ade80!important;}
    .tog-out{background:#1f0d0d!important;color:#f87171!important;}
    .field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#555;margin-bottom:8px;}
    .inp{width:100%;background:#0d0d14;border:1.5px solid #1e1e2e;border-radius:14px;padding:13px 16px;color:#f0f0f8;font-family:inherit;font-size:15px;outline:none;margin-bottom:14px;transition:border-color .2s;-webkit-appearance:none;}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    input[type=number]{-moz-appearance:textfield;}
    .inp:focus{border-color:#7c5cfc;}
    .inp::placeholder{color:#444;}
    .kat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
    .kat-item{background:#0d0d14;border:1.5px solid #1e1e2e;border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;color:#666;cursor:pointer;line-height:1.4;}
    .kat-item.sel{border-color:#7c5cfc;background:#7c5cfc1a;color:#c4a8ff;}
    .submit-btn{width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c5cfc,#3a8eff);color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed;}
    .filter-row{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 12px;scrollbar-width:none;}
    .filter-pill{flex-shrink:0;background:#16161f;border:1px solid #2a2a3a;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:#666;cursor:pointer;white-space:nowrap;}
    .filter-pill.sel{background:#7c5cfc22;border-color:#7c5cfc;color:#c4a8ff;}
    .export-btn{background:#1e1e2e;border:1px solid #2a2a3a;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:11px;font-weight:700;color:#888;cursor:pointer;display:flex;align-items:center;gap:5px;}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid #3a3a5a;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:600;color:#f0f0f8;z-index:9999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:toastIn .25s ease;}
    .toast.err{background:#1f0d0d;border-color:#5a2a2a;color:#f87171;}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    .sync-bar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#7c5cfc,#3a8eff,#7c5cfc);background-size:200%;animation:syncAnim 1.5s linear infinite;z-index:9999;}
    @keyframes syncAnim{0%{background-position:0%}100%{background-position:200%;}}
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:80px;background:#0d0d14ee;border-top:1px solid #1e1e2e;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px;backdrop-filter:blur(24px);}
    .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 20px;border-radius:16px;cursor:pointer;border:none;background:none;}
    .nav-btn.act{background:#1e1e2e;}
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#444;}
    .nav-btn.act .nav-label{color:#c4a8ff;}
    .empty{text-align:center;padding:48px 20px;}
    .empty-icon{font-size:48px;margin-bottom:12px;}
    .empty-text{font-size:15px;font-weight:600;color:#555;}
    .empty-sub{font-size:13px;margin-top:6px;color:#333;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
    .modal-sheet{background:#13131c;border-radius:28px 28px 0 0;border:1px solid #2a2a3a;padding:28px 24px 40px;width:100%;max-width:430px;animation:slideUp .3s ease;}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
    .modal-title{font-size:18px;font-weight:700;color:#f0f0f8;margin-bottom:6px;text-align:center;}
    .modal-sub{font-size:13px;color:#666;margin-bottom:20px;line-height:1.5;text-align:center;}
    .modal-close{width:100%;padding:13px;border-radius:16px;border:1px solid #2a2a3a;background:#1e1e2e;color:#888;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
  </style>
</head>
<body>

  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyDxRlytnV4RnHksjhErotD9fsLGxg4J5g4",
      authDomain:        "finance-berdua.firebaseapp.com",

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;

    const DB_PATH = "finance_berdua";
    const KATEGORI = {
      Pemasukan:   ["Gaji","Bonus","Lainnya"],
      Pengeluaran: ["Makan","Transport","Belanja","Tagihan","Nongkrong","Hiburan","Tabungan","Lainnya"],
    };
    const EMOJI = {
      Gaji:"💼",Bonus:"🎁",Makan:"🍜",Transport:"🚗",
      Belanja:"🛍️",Tagihan:"📋",Nongkrong:"☕",Hiburan:"🎮",
      Tabungan:"🐷",Lainnya:"📦",
    };
    const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const fmtRp   = n => "Rp " + Math.abs(Math.round(n)).toLocaleString("id-ID");
    const today   = () => new Date().toISOString().split("T")[0];
    const fmtDate    = s => { if (!s) return ""; const [,m,d] = s.split("-"); return `${d} ${BULAN[+m-1]}`; };
    const monthLabel = key => { const [y,m] = key.split("-"); return `${BULAN[+m-1]} ${y}`; };
    const txMonth    = t => t.tanggal.slice(0,7);
    const THREE_MONTHS_AGO = (() => { const d=new Date(); d.setMonth(d.getMonth()-3); return d.toISOString().slice(0,7); })();
    const GEMINI_API_KEY = "AIzaSyBZMc-FwSso4QFgDR60zuYuJieDWc67Q6g";

    // ── IndexedDB untuk simpan template binary ──
    const IDB = {
      open: () => new Promise((res,rej) => {
        const r = indexedDB.open("finance_berdua_db", 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore("tpl");
        r.onsuccess = e => res(e.target.result);
        r.onerror   = () => rej();
      }),
      save: async (name, buffer) => {
        try { 
            const d = await IDB.open(); 
            d.transaction("tpl","readwrite").objectStore("tpl").put({name,buffer},"k"); 
        } catch (err) {}
      },
      load: async () => {
        try {
          const d = await IDB.open();
          return await new Promise((res,rej) => {
            const r = d.transaction("tpl","readonly").objectStore("tpl").get("k");
            r.onsuccess = () => res(r.result||null);
            r.onerror   = () => rej(null);
          });
        } catch (err) { return null; }
      },
    };

    // ── Parse tanggal dari Excel ──
    const excelDateToStr = val => {
      if (!val) return null;
      if (typeof val === "string") {
        if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
        const m = val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
        return null;
      }
      if (typeof val === "number") {
        const d = new Date(Math.round((val-25569)*86400*1000));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
      }
      return null;
    };

    // ── Download helper (iOS Safari compatible) ──
    const downloadBlob = (blob, fileName) => {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement("a");
      a.style.display = "none";
      a.href     = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };

    function App() {
      const [tab, setTab]                     = useState("dashboard");
      const [transactions, setTransactions]   = useState([]);
      const [myName, setMyName]               = useState("");
      const [nameInput, setNameInput]         = useState("");
      const [nameSet, setNameSet]             = useState(false);
      const [syncing, setSyncing]             = useState(false);
      const [online, setOnline]               = useState(false);
      const [partnerOnline, setPartnerOnline] = useState(false);
      const [partnerName, setPartnerName]     = useState("");
      const [toast, setToast]                 = useState(null);
      const [filterJenis, setFilterJenis]     = useState("Semua");
      const [filterMonth, setFilterMonth]     = useState("");
      const [dashMonth, setDashMonth]         = useState(() => new Date().toISOString().slice(0,7));
      const [search, setSearch]               = useState("");
      const [showOld, setShowOld]             = useState(false);
      const [hideBalance, setHideBalance]     = useState(false);
      const [editTx, setEditTx]               = useState(null);
      const [templateData, setTemplateData]   = useState(null);
      const [templateName, setTemplateName]   = useState("");
      const [exportModal, setExportModal]     = useState(false);
      const [importModal, setImportModal]     = useState(null);
      const [form, setForm] = useState({ tanggal:today(), jenis:"Pengeluaran", kategori:"Makan", deskripsi:"", nominal:"" });

      // ── Split Bill State ──
      const [sbStep, setSbStep]           = useState(0);
      const [sbInputMode, setSbInputMode] = useState(null);
      const [sbFriends, setSbFriends]     = useState([]);
      const [sbItems, setSbItems]         = useState([]);
      const [sbAssigned, setSbAssigned]   = useState({});
      const [sbFriendInput, setSbFriendInput] = useState("");
      const [sbItemName, setSbItemName]   = useState("");
      const [sbItemPrice, setSbItemPrice] = useState("");
      const [sbSelectedFor, setSbSelectedFor] = useState(["Gue"]);
      const [sbPaidMap, setSbPaidMap]     = useState({});
      const [sbExported, setSbExported]   = useState(false);
      const [sbScanning, setSbScanning]   = useState(false);
      const [sbScanProgress, setSbScanProgress] = useState(0);
      const sbFileRef = useRef(null);

      const nameRef    = useRef("");
      const writingRef = useRef(false);
      const txsRef     = useRef([]);

      const showToast = (msg, type="ok") => {
        setToast({msg,type});
        setTimeout(() => setToast(null), 2800);
      };

      useEffect(() => {
        IDB.load().then(saved => {
          if (saved) { setTemplateData(saved.buffer); setTemplateName(saved.name); }
        });
      }, []);

      const setupNotif = async (name) => {
        if (!("Notification" in window)) return;
        try {
          const perm = await Notification.requestPermission();
          if (perm !== "granted") return;
          db.ref(`finance_berdua/notifs/${name}`).on("child_added", snap => {
            const n = snap.val();
            if (!n) return;
            if (document.visibilityState === "hidden" || document.visibilityState === "visible") {
              new Notification(n.title, { body: n.body, icon: "/icon-192.png", badge: "/icon-192.png", vibrate: [200, 100, 200] });
            }
            snap.ref.remove();
          });
        } catch(err) { console.log("Notif setup failed:", err); }
      };

      const sendNotif = async (title, body) => {
        try {
          const snap = await db.ref("finance_berdua/heartbeats").get();
          const users = snap.val() || {};
          const others = Object.keys(users).filter(n => n !== nameRef.current);
          if (others.length === 0) return;
          const now = Date.now();
          await Promise.all(others.map(name => db.ref(`finance_berdua/notifs/${name}`).push({ title, body, ts: now }) ));
        } catch(err) { console.log("Send notif failed:", err); }
      };

      useEffect(() => {
        if (!nameSet) return;
        nameRef.current = myName;
        setupNotif(myName);

        const txRef = db.ref(`${DB_PATH}/transactions`);
        const unsubTx = txRef.on("value", snap => {
          if (writingRef.current) return;
          const data = snap.val();
          const list = data ? Object.values(data).sort((a,b) => b.id-a.id) : [];
          txsRef.current = list;
          setTransactions(list);
          setOnline(true);
        }, () => setOnline(false));

        const sendHB = () => db.ref(`${DB_PATH}/heartbeats/${myName}`).set(Date.now()).catch(err=>{});
        sendHB();
        const hbInt = setInterval(sendHB, 5000);

        const hbRef = db.ref(`${DB_PATH}/heartbeats`);
        const unsubHB = hbRef.on("value", snap => {
          const hbs = snap.val() || {};
          const now = Date.now();
          const partners = Object.entries(hbs).filter(([n,ts]) => n !== myName && (now-ts) < 12000);
          setPartnerOnline(partners.length > 0);
          if (partners.length > 0) setPartnerName(partners[0][0]);
        });

        return () => {
          txRef.off("value", unsubTx);
          hbRef.off("value", unsubHB);
          clearInterval(hbInt);
          db.ref(`${DB_PATH}/heartbeats/${myName}`).remove();
        };
      }, [nameSet, myName]);

      const saveTx = async list => {
        writingRef.current = true;
        setSyncing(true);
        try {
          const obj = {};
          list.forEach(t => { obj[t.id] = t; });
          await db.ref(`${DB_PATH}/transactions`).set(obj);
          setOnline(true);
        } catch (err) { setOnline(false); showToast("Gagal sync, cek koneksi!", "err"); }
        setSyncing(false);
        writingRef.current = false;
      };

      const FRIEND_COLORS = ["#f59e0b","#4ade80","#f87171","#38bdf8","#fb923c"];
      const SB_PERSON_COLORS = { "Gue": { bg:"#1e1e3a", color:"#8888ff" }, "Pasangan": { bg:"#1a0d2a", color:"#c084fc" } };
      const sbGetColor = (name) => {
        if (SB_PERSON_COLORS[name]) return SB_PERSON_COLORS[name];
        const idx = sbFriends.indexOf(name);
        const c   = FRIEND_COLORS[idx % FRIEND_COLORS.length];
        return { bg: c+"22", color: c };
      };
      const sbAllPeople = ["Gue", "Pasangan", ...sbFriends];

      const sbTotals = (() => {
        const t = {};
        sbAllPeople.forEach(p => { t[p] = 0; });
        sbItems.forEach(item => {
          const assignees = sbInputMode === "scan" ? (sbAssigned[item.id] || []) : (item.for || []);
          if (assignees.length === 0) return;
          const share = item.price / assignees.length;
          assignees.forEach(p => { t[p] = (t[p]||0) + share; });
        });
        return t;
      })();
      const sbMyTotal    = (sbTotals["Gue"]||0) + (sbTotals["Pasangan"]||0);
      const parseRp      = s => parseInt(String(s).replace(/\./g,"").replace(/\D/g,"")) || 0;
      const sbUnassigned = sbInputMode === "scan" ? sbItems.filter(item => (sbAssigned[item.id]||[]).length === 0).length : 0;

      const sbToggleAssign = (itemId, name) => {
        setSbAssigned(prev => {
          const curr = prev[itemId] || [];
          const next = curr.includes(name) ? curr.filter(x=>x!==name) : [...curr, name];
          return { ...prev, [itemId]: next };
        });
      };

      const sbAddFriend = () => {
        const name = sbFriendInput.trim();
        if (!name || sbFriends.includes(name)) return;
        setSbFriends(f => [...f, name]);
        setSbFriendInput("");
      };

      const sbAddItem = () => {
        if (!sbItemName.trim() || !sbItemPrice || sbSelectedFor.length === 0) return;
        const price = parseRp(sbItemPrice);
        if (price <= 0) return;

        reader.onload = ev => {

          setTemplateData(buffer);
          setTemplateName(file.name);
          IDB.save(file.name, buffer);

          try {
            const wb = XLSX.read(new Uint8Array(buffer), { type:"array" });
            const parsed = [];
            BULAN.forEach(bulan => {
              if (!wb.SheetNames.includes(bulan)) return;
              const rows = XLSX.utils.sheet_to_json(wb.Sheets[bulan], { header:1, defval:"" });
              for (let i = 1; i < rows.length; i++) {
                const [tanggalRaw, jenisRaw, kategori, deskripsi, nominalRaw] = rows[i];
                if (!tanggalRaw && !deskripsi) continue;
                if (String(deskripsi).toUpperCase().includes("SUMMARY")) break;
                const tanggal = excelDateToStr(tanggalRaw);
                if (!tanggal) continue;

                const allKat  = [...KATEGORI.Pemasukan, ...KATEGORI.Pengeluaran];

                  deskripsi: String(deskripsi) || "-",

      const handleExport = () => {
        if (!templateData) { showToast("Upload dulu file Excel lo di dashboard!", "err"); return; }
        try {
          const wb = XLSX.read(new Uint8Array(templateData), { type:"array" });
          const byMonth = {};
          [...transactions]
            .sort((a,b) => a.tanggal.localeCompare(b.tanggal)) // PENTING: Fix buat iOS Safari lama biar gak NaN
            .forEach(t => {
              const key = BULAN[+t.tanggal.split("-")[1]-1];
              if (!byMonth[key]) byMonth[key] = [];
              byMonth[key].push(t);
            });

          Object.entries(byMonth).forEach(([bulan, txs]) => {
            if (!wb.SheetNames.includes(bulan)) return;
            const ws    = wb.Sheets[bulan];
            const range = XLSX.utils.decode_range(ws["!ref"] || "A1:I200");
            for (let r = 1; r <= range.e.r; r++)
              for (let c = 0; c <= 5; c++) {
                const ref = XLSX.utils.encode_cell({r,c});
                if (ws[ref]) delete ws[ref];
              }
            let saldo = 0;
            txs.forEach((t, i) => {
              const row = i + 1;
              saldo += t.jenis === "Pemasukan" ? t.nominal : -t.nominal;
              [
                { v: Math.floor((new Date(t.tanggal+"T00:00:00") - new Date(Date.UTC(1899,11,30))) / 86400000), t:"n", z:"DD/MM/YYYY" },
                { v: t.jenis === "Pemasukan" ? "masuk" : "keluar", t:"s" },
                { v: t.kategori, t:"s" },
                { v: t.deskripsi, t:"s" },
                { v: t.nominal, t:"n" },
                { v: saldo, t:"n" },
              ].forEach((cell,c) => { ws[XLSX.utils.encode_cell({r:row,c})] = cell; });
            });
            if (txs.length > 0) {
              const nr = XLSX.utils.decode_range(ws["!ref"] || "A1:I1");
              nr.e.r = Math.max(nr.e.r, txs.length);
              ws["!ref"] = XLSX.utils.encode_range(nr);
            }
          });

          const arr  = XLSX.write(wb, { bookType:"xlsx", type:"array" });
